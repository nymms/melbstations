<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="MelBoard">
    <link rel="apple-touch-icon" href="melboard-icon.png">
    <link rel="stylesheet" href="light.css" id="departure-link">
    <link rel="stylesheet" href="ptvnetwork2019.css" id="header-link">
    <title>Melb PT Departure Board</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #000000;
        font-family: 'Network Sans 2019', Arial, sans-serif;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('https://raw.githubusercontent.com/nymms/melbstations/main/NETWORKSANS-2019-REGULAR.TTF') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('https://raw.githubusercontent.com/nymms/melbstations/main/NETWORKSANS-2019-MEDIUM.TTF') format('truetype');
        font-weight: 600;
        font-style: normal;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('https://raw.githubusercontent.com/nymms/melbstations/main/NETWORKSANS-2019-BOLD.TTF') format('truetype');
        font-weight: 800;
        font-style: normal;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('https://raw.githubusercontent.com/nymms/melbstations/main/NETWORKSANS-2019-LIGHT.TTF') format('truetype');
        font-weight: 200;
        font-style: normal;
    }

    .station-board {
        width: 1280px;
        overflow: hidden;
        margin: 0 auto;
        position: relative;
        left: 0;
    }

    .clock {
        font-size: 38px;
        width: 300px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 3px 15px;
    }

    .delay-indicator {
        color: #FE5000;
        font-size: 56px;
        font-weight: bold;
    }

    .delay-indicator.future {
        font-size: 28px;
    }

    .departure-container {
        margin-top: 0px;
        height: 720px;
    }

    .departure-header {
        padding: 10px 20px 0px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 25px solid #95979A;
        height: 90px;
    }
        
    .departure-header .platform {
        background-color: #95979A;
        color: #000000;
        padding: 8px;
        font-size: 28px;
        font-weight: 900;
        width: 40px;
        height: 50px;
        text-align: center;
    }

    .departure-header.future {
        padding: 5px;
        margin-top: 5px;
        margin-bottom: 5px;
        height: initial;
        border-top: none;
        border-left: 6px solid #95979A;
    }

    .departure-item {
        margin: 0 auto 0 auto;
        overflow: hidden;
    }

    .departure-item.has-no-trains .departure-header,
    .departure-item.has-no-trains .next-stations {
        border: none;
    }

    .departure-item.future {
        margin: 4px 0 4px 15px;
        position: relative;
        left: 0px;
    }

    .departure-time {
        font-size: 60px;
        font-family: 'Network Sans 2019', Arial, sans-serif;
        font-weight: 200;
    }

    .departure-time.future {
        font-size: 30px;
    }

    .departurestack {
        width: 75%;
    }

    .destination {
        font-size: 72px;
        font-family: 'Network Sans 2019', Arial, sans-serif;
        font-weight: 600;
    }

    .destination.future {
        font-size: 30px;
        font-weight: 600;
    }

    .duration {
        padding: 4px;
        font-size: 60px;
        font-weight: normal;
        min-width: 260px;
        text-align: center;
        height: 80px;
    }

    .duration.future {
        font-size: 30px;
        font-weight: 800;
        min-width: 135px;
        height: 42px;
        padding: 2px;
    }

    .header-and-platform-wrapper {
        display: flex;
        align-items: flex-start;
        min-height: 130px;
        margin-top: -142px;
    }

    .hidden-pin-toggle {
        display: none;
    }

    .hidden-pin-toggle:checked ~ .pin-button ~ .header-and-platform-wrapper,
    .hidden-pin-toggle:checked ~ .pin-button {
        margin-top: 0 !important;
    }

    .hidden-pin-toggle:checked ~ #settings-panel,
    .station-board:not(.touch-mode):hover .hidden-pin-toggle:not(:checked) ~ #settings-panel,
    .station-board.revealed .hidden-pin-toggle:not(:checked) ~ #settings-panel {
        margin-top: 0 !important;
    }

    #headerPlatform {
        text-align: center;
        color: #333434;
        background-color: #fff;
        flex-shrink: 0;
        border-left: 2px solid #707372;
    }

    .last-updated {
        font-size: 8px;
        padding: 2px;
        color: #ffffff;
    }

    .next-station {
        font-size: 30px;
        font-weight: normal;
        padding-left: 18px;
        position: relative;
        display: flex;
        align-items: center;
        border-left: 6px solid #95979A;
    }

    .next-station::before {
        content: '◼︎';
        font-weight: 900;
        font-size: 12px;
        position: absolute;
        left: -2px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: #95979A;
    }

    .next-station.current {
        border-left: 6px solid #95979A;
    }

    .next-station.current .station-text {
        padding: 4px 6px;
        background-color: #95979A;
        color: #000000;
    }

    .next-station.last-station {
        border-left: none !important;
        padding-left: 25px;
    }

    .next-station.last-station::after {
        display: none !important;
    }

    .next-station.last-station::before {
        content: '';
        display: inline-block;
        position: absolute;
        left: -10px;
        top: 8px;
        width: 25px;
        height: 25px;
        background-color: #95979A;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="20" y1="75" x2="80" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="50" y1="0" x2="50" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="20" y1="75" x2="80" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="50" y1="0" x2="50" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
    }

    .next-station.skipped::before {
        content: '';
        position: absolute;
        left: -10px;
        top: 97%;
        transform: translate(0, -50%);
        width: 30px;
        height: 30px;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:white;stroke-width:8px;"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:white;stroke-width:8px;"/></svg>');
    }

    .next-station.skipped::after {
        content: '';
        position: absolute;
        left: -10px;
        top: 75%;
        transform: translate(0, -50%);
        width: 30px;
        height: 30px;
        background-color: #95979A;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:black;stroke-width:12px;"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:black;stroke-width:12px;"/></svg>');
    }

    .next-station.continuing {
        min-height: 2em;
    }

    .next-station.continuing .station-text {
        color: #000;
        font-size: 30px;
        font-weight: 200;
        font-style: italic;
        padding-left: 10px;
    }

    .next-station.continuing::before,
    .next-station.continuing::after {
        content: '';
        position: absolute;
        left: -6px;
        width: 50px;
        height: 50px;
        background-color: #fff;
        z-index: 1;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="8" x2="11" y2="20" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="11" y1="28" x2="11" y2="40" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="8" x2="11" y2="20" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="11" y1="28" x2="11" y2="40" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
    }
    .next-station.continuing::before { top: 2em; }
    .next-station.continuing::after { top: 1em; }

    .next-station.interchange::after {
        content: '';
        position: absolute;
        left: -17px;
        top: 70%;
        transform: translate(0, -50%);
        width: 30px;
        height: 30px;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="40" rx="20" ry="20" fill="%23ffffff" stroke="%23000000" stroke-width="8"/></svg>');
        background-repeat: no-repeat;
        background-size: contain;
    }

    .next-station.skipped ~ .next-station.skipped:before,
    .next-station.skipped ~ .next-station.skipped:after {
        content: none;
    }

    .next-stations {
        padding: 0px 20px 5px 0px;
        margin-left: 20px;
        margin-right: 20px;
        min-height: 380px;
    }

    .no-trains {
        font-size: 42px;
        font-weight: 600;
        text-align: center;
        top: 50px;
        color: #ffffff;
    }

    .otherdepartures {
        display: flex;
    }

    .pin-button {
        position: absolute;
        top: 170px;
        left: -5px;
        cursor: pointer;
        z-index: 1002;
        padding: 5px;
        border-radius: 50%;
        margin-top: -142px;
    }

    .pin-button svg {
        width: 24px;
        height: 24px;
        fill: #333434;
        transition: transform 0.3s ease-out;
    }

    .hidden-pin-toggle:checked + .pin-button svg {
        transform: rotate(45deg);
    }

    .route-info {
        padding: 0px 20px 8px 25px;
        font-size: 36px;
        font-weight: 200;
        justify-content: space-between;
        align-items: center;
        height: 50px;
        color: #ffffff;
    }

    .route-info.future {
        padding: 0px;
        padding-left: 20px;
        font-size: 24px;
        justify-content: normal;
        align-items: normal;
        height: initial;
    }

    .settings {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        position: relative;
        margin-top: 0px;
        left: 60px;
        width: 100%;
        z-index: 1000;
    }

    .settings select {
        padding: 2px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-size: 16px;
    }

    #settingsButton {
        background: none;
        border: none;
        cursor: pointer;
        outline: none;
        display: inline-flex;
        align-items: center;
        position: absolute;
        left: 27px;
        top: 170px;
        z-index: 1003;
    }

    #settingsButton svg {
        margin: 5px;
        width: 20px;
        height: 20px;
        display: block;
    }

    .station-board:not(.touch-mode):hover .hidden-pin-toggle:not(:checked) ~ .pin-button ~ .header-and-platform-wrapper,
    .station-board.revealed .hidden-pin-toggle:not(:checked) ~ .pin-button ~ .header-and-platform-wrapper,
    .station-board:not(.touch-mode):hover .hidden-pin-toggle:not(:checked) ~ .pin-button,
    .station-board.revealed .hidden-pin-toggle:not(:checked) ~ .pin-button {
        margin-top: 0 !important;
    }

    .station-board:not(.touch-mode):hover .settings.visible,
    .station-board.revealed .settings.visible,
    .hidden-pin-toggle:checked ~ .settings.visible {
        opacity: 1;
        visibility: visible;
    }

    .station-header {
        width: 100%;
        box-shadow: inset 0 8px 8px -10px rgba(0, 0, 0, 0.8);
        position: relative;
        z-index: 1001;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        flex-grow: 1;
    }

    .station-name {
        font-size: 56px;
        padding-top: 16px;
        width: 100%;
        height: 100px;
        color: #ffffff;
    }

    .stations-column {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding-top: 12px;
        background-repeat: no-repeat;
        position: relative;
    }

    .stations-column::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 25px;
        height: 25px;
        background-color: #95979A;
        z-index: 1;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="8" x2="11" y2="20" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="11" y1="28" x2="11" y2="40" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="8" x2="11" y2="20" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="11" y1="28" x2="11" y2="40" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
    }

    .stations-column:first-child {
        padding-top: 12px;
    }

    .stations-column:first-child::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 25px;
        height: 25px;
        background-color: #95979A;
        z-index: 1;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="0" x2="11" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="0" x2="11" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
    }

    .stations-column .next-station:last-child:not(.last-station)::after {
        content: '';
        position: absolute;
        left: -6px;
        top: 41px;
        transform: translateY(-50%);
        width: 25px;
        height: 25px;
        background-color: #95979A;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="8" x2="11" y2="20" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="11" y1="28" x2="11" y2="40" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="11" y1="8" x2="11" y2="20" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="11" y1="28" x2="11" y2="40" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
    }

    .stations-list {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: flex-start;
    }

    .time-destination {
        display: flex;
        align-items: center;
        gap: 15px;
        color: #ffffff;
    }

    .time-destination.future {
        gap: 10px;
    }

    .time-info {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: #ffffff;
    }

    .time-info.future {
        margin-top: 0px;
    }
    </style>
</head>
<body>
    <div class="station-board">
        <input type="checkbox" id="pin-toggle" class="hidden-pin-toggle">
        <label for="pin-toggle" class="pin-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 12V4H17V2H7V4H8V12L6 14V16H11.2V22H12.8V16H18V14L16 12Z" />
            </svg>
        </label>
        <div class="header-and-platform-wrapper">
            <div class="station-header">
                <div class="station-name">Loading...</div>
                <button id="settingsButton" aria-expanded="false" aria-controls="settings-panel" title="Toggle Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                        <path id="gearOutline" d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" fill="#333434" />
                        <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" fill="#000000"/>
                    </svg>
                </button>
            </div>
            <div class="platform" id="headerPlatform"></div>
        </div>
        <div class="settings" id="settings-panel">
            <select id="stationSelect">
                <option value="">Select Station...</option>
            </select>
            <select id="platformSelect" style="width:40px;">
                <option value="">All Platforms</option>
            </select>
            <select id="cssDeparture">
                <option value="light.css">light</option>
                <option value="dark.css">dark</option>
            </select>
            <select id="cssHeader">
                <option value="ptvnetwork2019.css">PTV 2024</option>
                <option value="ptvhelvetica.css">PTV 2012</option>
                <option value="metlink2003.css">Metlink 2003</option>
                <option value="ptcgoudy.css">PTC Goudy</option>
            </select>
        </div>
        <div class="departure-container">
            <div class="departure-item" style="display: block;">
               <div class="departure-header" id="mainHeader">
                   <div class="time-destination">
                     <span class="departure-time"></span>
                     <span class="destination"></span>
                    </div>
                    <div class="time-info">
                     <div class="delay-indicator"></div>
                     <div class="duration"></div>
                    </div>
                </div>
                <div class="route-info"><span></span></div>
                <div class="next-stations">
                 <div class="stations-list"></div>
                </div>
            </div>
            <div class="otherdepartures">
                <div class="departurestack">
                    <div class="departure-item future">
                        <div class="departure-header future">
                            <div class="time-destination future">
                                <span class="departure-time future"></span>
                                <span class="destination future"></span>
                                <span class="route-info future"></span>
                            </div>
                            <div class="time-info future">
                                <div class="delay-indicator future"></div>
                                <div class="duration future"></div>
                            </div>
                        </div>
                    </div>
                    <div class="departure-item future">
                        <div class="departure-header future">
                            <div class="time-destination future">
                                <span class="departure-time future"></span>
                                <span class="destination future"></span>
                                <span class="route-info future"></span>
                            </div>
                            <div class="time-info future">
                                <div class="delay-indicator future"></div>
                                <div class="duration future"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="clock"><span id="live-clock" style="color:#ffffff;"></span></div>
            </div>
        </div>
        <div class="last-updated" id="lastUpdated">Loading...</div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var departureItem = document.querySelector('.departure-item');
        var destinationElement = document.querySelector('.destination');
        var platformElement = document.querySelector('.departure-header .platform');
        var headerPlatformElement = document.getElementById('headerPlatform');
        var stationNameElement = document.querySelector('.station-name');
        var lastUpdatedElement = document.getElementById('lastUpdated');
        var routeInfoElement = document.querySelector('.route-info span');
        var departureTimeElement = document.querySelector('.departure-time');
        var delayIndicatorElement = document.querySelector('.delay-indicator');
        var durationElement = document.querySelector('.duration');
        var headerElement = document.querySelector('.station-header');
        var stationBoardElement = document.querySelector('.station-board');
        var settingsButton = document.getElementById('settingsButton');
        var settingsPanel = document.getElementById('settings-panel');
        var mainHeader = document.getElementById('mainHeader');
        
        function getQueryParams() {
            var params = {};
            var search = window.location.search.substring(1);
            if (!search) return params;
            var hashes = search.split('&');
            for (var i = 0; i < hashes.length; i++) {
                var hash = hashes[i].split('=');
                params[hash[0]] = decodeURIComponent(hash[1]);
            }
            return params;
        }

        var addressParams = getQueryParams();
        var currentStopId = parseInt(addressParams['stop']) || 1127;
        var currentPlatform = addressParams['platform'] || "1";
        var currentRunId = null;
        var isUserChange = false;

        var getDepartureApiUrl = function() {
            var baseUrl = 'http://192.168.1.40:8080/api/next-departure?stop_id=' + currentStopId;
            return currentPlatform ? baseUrl + '&platform=' + currentPlatform : baseUrl;
        };
        
        var stationsData = null;

        function apiGet(url, callback, errorCallback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(data);
                        } catch (e) {
                            if (errorCallback) errorCallback(e);
                        }
                    } else {
                        // FORCE THE ERROR TO SHOW ON THE SCREEN FOR THE IPAD
                        var errText = 'XHR Error: status ' + xhr.status;
                        document.getElementById('lastUpdated').textContent = errText;
                        document.querySelector('.station-name').textContent = errText;
                        if (errorCallback) errorCallback({ status: xhr.status });
                    }
                }
            };
            xhr.onerror = function() {
                // Catches silent network / SSL handshake drops
                document.getElementById('lastUpdated').textContent = 'Network/SSL Fail (TLS mismatch)';
                document.querySelector('.station-name').textContent = 'Network/SSL Fail';
            };
            xhr.send();
        }

        var getRouteSegment = function(routeId, currentStopId, finalStopId) {
            if (!routeOrderData) return null;

            var routeStops = null;
            var currentPos = -1;
            var finalPos = -1;
            var keys = Object.keys(routeOrderData);

            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                var route = routeOrderData[key];
                var usable = key === String(routeId) || (route.route_ids && route.route_ids.indexOf(Number(routeId)) !== -1);
                if (!usable) continue;
                
                var c = -1, f = -1;
                for (var j = 0; j < route.stops.length; j++) {
                    if (route.stops[j].stop_id === currentStopId) c = j;
                    if (route.stops[j].stop_id === finalStopId) f = j;
                }

                if (c !== -1 && f !== -1) {
                    routeStops = route.stops;
                    currentPos = c;
                    finalPos = f;
                    break;
                }
            }

            if (!routeStops) return null;
            
            var segment;
            if (currentPos < finalPos) {
                segment = routeStops.slice(currentPos, finalPos + 1);
            } else {
                segment = routeStops.slice(finalPos, currentPos + 1).reverse();
            }
            
            return segment;
        };

        var detectExpressService = function(routeSegment, actualStops) {
            if (!routeSegment || routeSegment.length === 0) return { isExpress: false, skipped: [] };
            
            var actualStopIds = [];
            for (var i = 0; i < actualStops.length; i++) {
                actualStopIds.push(actualStops[i].stop_id);
            }

            var skippedStations = [];
            var consecutiveSkips = 0;
            var maxConsecutiveSkips = 0;
            
            for (var i = 0; i < routeSegment.length; i++) {
                var stop = routeSegment[i];
                if (actualStopIds.indexOf(stop.stop_id) === -1) {
                    skippedStations.push(stop);
                    consecutiveSkips++;
                    if (consecutiveSkips > maxConsecutiveSkips) {
                        maxConsecutiveSkips = consecutiveSkips;
                    }
                } else {
                    consecutiveSkips = 0;
                }
            }
            
            return {
                isExpress: maxConsecutiveSkips >= 2,
                skipped: skippedStations,
                singleSkip: skippedStations.length === 1 ? skippedStations[0] : null
            };
        };

        var calculateColumnDistribution = function(numStops) {
            if (numStops <= 7) {
                return { columns: 1, distribution: [numStops] };
            }
    
            if (numStops <= 14) {
                var col1 = Math.ceil(numStops / 2);
                var col2 = numStops - col1;
                return { columns: 2, distribution: [col1, col2] };
            }
    
            if (numStops <= 24) {
                var base = Math.floor(numStops / 3);
                var remainder = numStops % 3;
                var distribution = [base, base, base];
        
                for (var i = 0; i < remainder; i++) {
                    distribution[i]++;
                }
                return { columns: 3, distribution: distribution };
            }
    
            if (numStops <= 30) {
                var col3 = numStops - 20;
                return { columns: 3, distribution: [10, 10, col3] };
            }
    
            var col4 = numStops - 30;
            return { columns: 4, distribution: [10, 10, 10, col4] };
        };

        var analyzeInboundRoute = function(stops, currentStopId) {
            var cityStations = [1155, 1071, 1181, 1068, 1120];
            var loopStations = [1068, 1120, 1155];
            
            var currentIndex = -1;
            for (var i = 0; i < stops.length; i++) {
                if (stops[i].stop_id === currentStopId) {
                    currentIndex = i;
                    break;
                }
            }
            if (currentIndex === -1) return null;
            
            var remainingStops = stops.slice(currentIndex);
            var futureCityStationsOnly = [];
            for (var i = 1; i < remainingStops.length; i++) {
                futureCityStationsOnly.push(remainingStops[i].stop_id);
            }

            var hasFutureCityStations = false;
            for (var i = 0; i < futureCityStationsOnly.length; i++) {
                if (cityStations.indexOf(futureCityStationsOnly[i]) !== -1) {
                    hasFutureCityStations = true;
                    break;
                }
            }
            if (!hasFutureCityStations) return null;

            var firstCityStation = null;
            for (var i = 0; i < futureCityStationsOnly.length; i++) {
                if (cityStations.indexOf(futureCityStationsOnly[i]) !== -1) {
                    firstCityStation = futureCityStationsOnly[i];
                    break;
                }
            }

            if (firstCityStation === 1071) {
                return "Direct to Flinders Street";
            }

            var hasLoopStations = false;
            for (var i = 0; i < futureCityStationsOnly.length; i++) {
                if (loopStations.indexOf(futureCityStationsOnly[i]) !== -1) {
                    hasLoopStations = true;
                    break;
                }
            }

            if (hasLoopStations) return "via the City Loop";
            if (firstCityStation === 1181) return "via Southern Cross";

            return "to City";
        };

        var analyzeOutboundRoute = function(stops, currentStopId, expressInfo) {
            var loopStations = [1068, 1120, 1155];
            
            var currentIndex = -1;
            for (var i = 0; i < stops.length; i++) {
                if (stops[i].stop_id === currentStopId) {
                    currentIndex = i;
                    break;
                }
            }
            if (currentIndex === -1) return null;
            
            var remainingStops = stops.slice(currentIndex);
            var futureStopIds = [];
            for (var i = 0; i < remainingStops.length; i++) {
                futureStopIds.push(remainingStops[i].stop_id);
            }
            
            var hasFutureLoopStations = false;
            for (var i = 0; i < futureStopIds.length; i++) {
                if (loopStations.indexOf(futureStopIds[i]) !== -1) {
                    hasFutureLoopStations = true;
                    break;
                }
            }

            var tunnelStations = [1232, 1233, 1234, 1235, 1236];
            var hasFutureTunnelStations = false;
            for (var i = 1; i < futureStopIds.length; i++) {
                if (tunnelStations.indexOf(futureStopIds[i]) !== -1) {
                    hasFutureTunnelStations = true;
                    break;
                }
            }
            
            var baseText = "Stopping all stations";
            if (expressInfo && expressInfo.isExpress) {
                baseText = "Express";
            } else if (expressInfo && expressInfo.singleSkip) {
                var skippedStationName = getStationName(expressInfo.singleSkip.stop_id);
                baseText = "Stopping all stations except " + skippedStationName;
            }
            
            if (hasFutureLoopStations) return baseText + " via City Loop";
            if (hasFutureTunnelStations) return baseText + " via Metro Tunnel";
            
            return baseText;
        };

        var populateStationDivs = function(stops, currentStopId, finalStopId, routeId) {
            var stationsList = document.querySelector('.stations-list');
            var existingColumns = stationsList.querySelectorAll('.stations-column');
            for (var i = 0; i < existingColumns.length; i++) {
                existingColumns[i].parentNode.removeChild(existingColumns[i]);
            }
            
            if (!stops || stops.length === 0) return;
            
            var routeSegment = getRouteSegment(routeId, currentStopId, finalStopId);
            var cityStops = [];
            var suburbanStartIndex = 0;
            
            if (!routeSegment) {
                var currentIndex = -1;
                for (var i = 0; i < stops.length; i++) {
                    if (stops[i].stop_id === currentStopId) { currentIndex = i; break; }
                }
                
                for (var i = currentIndex; i < stops.length; i++) {
                    var testSegment = getRouteSegment(routeId, stops[i].stop_id, finalStopId);
                    if (testSegment) {
                        routeSegment = testSegment;
                        suburbanStartIndex = i;
                        cityStops = stops.slice(currentIndex, i);
                        break;
                    }
                }
                
                if (!routeSegment) {
                    var stopsToShow = currentIndex >= 0 ? stops.slice(currentIndex) : stops;
                    populateActualStopsOnly(stopsToShow, finalStopId);
                    return;
                }
            }
            
            var suburbanStops = stops.slice(suburbanStartIndex);
            var expressInfo = detectExpressService(routeSegment, suburbanStops);
            var actualStopIds = [];
            for (var i = 0; i < suburbanStops.length; i++) {
                actualStopIds.push(suburbanStops[i].stop_id);
            }
            
            var totalStops = cityStops.length + routeSegment.length;
            var needsMessage = totalStops > MAX_SLOTS;
            var colDist = calculateColumnDistribution(needsMessage ? MAX_SLOTS : totalStops);
            var numColumns = colDist.columns;
            var distribution = colDist.distribution;
            
            for (var i = 0; i < numColumns; i++) {
                var column = document.createElement('div');
                column.className = 'stations-column route-color';
                stationsList.appendChild(column);
            }
            
            var columns = stationsList.querySelectorAll('.stations-column');
            var stationIndex = 0;
            var slot = 0;
            
            for (var colIndex = 0; colIndex < numColumns; colIndex++) {
                var stationsInThisColumn = distribution[colIndex];
                
                for (var i = 0; i < stationsInThisColumn && stationIndex < totalStops; i++) {
                    if (needsMessage && slot >= MESSAGE_FIRST_SLOT && slot < MESSAGE_FIRST_SLOT + MESSAGE_LINES.length) {
                        var messageDiv = document.createElement('div');
                        messageDiv.className = 'next-station continuing route-color';
                        var messageText = document.createElement('span');
                        messageText.className = 'station-text';
                        messageText.textContent = MESSAGE_LINES[slot - MESSAGE_FIRST_SLOT];
                        messageDiv.appendChild(messageText);
                        columns[colIndex].appendChild(messageDiv);
                        slot++;
                        continue;
                    }
                    if (needsMessage && slot === MESSAGE_FIRST_SLOT + MESSAGE_LINES.length) {
                        stationIndex = totalStops - TAIL_STOPS;
                    }

                    var stationDiv, stationText;
                    if (stationIndex < cityStops.length) {
                        var cityStop = cityStops[stationIndex];
                        stationDiv = document.createElement('div');
                        stationDiv.className = 'next-station route-color';
                        
                        if (stationIndex === 0) stationDiv.className += ' current';
                        if (isInterchangeStation(cityStop.stop_id)) stationDiv.className += ' interchange';

                        stationText = document.createElement('span');
                        stationText.className = 'station-text';
                        stationText.textContent = getStationName(cityStop.stop_id);
                    } else {
                        var suburbanIndex = stationIndex - cityStops.length;
                        var routeStop = routeSegment[suburbanIndex];
                        var isActualStop = actualStopIds.indexOf(routeStop.stop_id) !== -1;
                        
                        stationDiv = document.createElement('div');
                        stationDiv.className = isActualStop ? 'next-station route-color' : 'next-station skipped route-color';
                        
                        if (stationIndex === 0) stationDiv.className += ' current';
                        if (routeStop.stop_id === finalStopId) stationDiv.className += ' last-station';
                        if (isInterchangeStation(routeStop.stop_id)) stationDiv.className += ' interchange';
 
                        stationText = document.createElement('span');
                        stationText.className = 'station-text';
                        stationText.textContent = getStationName(routeStop.stop_id);
                    }
                    
                    stationDiv.appendChild(stationText);
                    columns[colIndex].appendChild(stationDiv);
                    stationIndex++;
                    slot++;
                }
            }
            return expressInfo;
        };

        var populateActualStopsOnly = function(stopsToShow, finalStopId) {

            var needsMessage = stopsToShow.length > MAX_SLOTS;

                    if (needsMessage && slot === MESSAGE_FIRST_SLOT + MESSAGE_LINES.length) {

                    var stop = stopsToShow[stationIndex];

        var calculateDuration = function(scheduledTime, estimatedTime) {
            var departureTime = new Date(estimatedTime || scheduledTime);
            var now = new Date();
            var diffMinutes = Math.floor((departureTime - now) / 60000);
            
            if (diffMinutes < 1) return "Now";
            if (diffMinutes < 60) return diffMinutes + " min";
            var hours = Math.floor(diffMinutes / 60);
            var mins = diffMinutes % 60;
            return hours + "h " + mins + "m";
        };

        var updateBoard = function() {
            apiGet(getDepartureApiUrl(), function(data) {
                if (data.platform_number === null) {
                    showNoDeparturesMessage(currentPlatform);
                    currentRunId = null;
                    return;
                }

                if (currentPlatform && data.platform_number !== currentPlatform) {
                    showNoDeparturesMessage(currentPlatform);
                    currentRunId = null;
                    return;
                }

                var route_id = data.route_id;
                var platform_number = data.platform_number;
                var scheduled_departure_utc = data.scheduled_departure_utc;
                var estimated_departure_utc = data.estimated_departure_utc;
                var delay_minutes = data.delay_minutes;
                var final_stop_id = data.final_stop_id;
                var run_id = data.run_id;
                
                var isNewService = run_id !== currentRunId;
                
                if (isNewService) {
                    currentRunId = run_id;
                    applyRouteColorDirect(route_id);
                    
                    if (platformElement) platformElement.textContent = platform_number || '?';
                    if (headerPlatformElement) headerPlatformElement.textContent = platform_number || '?';
                    if (stationNameElement) stationNameElement.textContent = getStationName(currentStopId);
                    
                    var destinationName = getStationName(final_stop_id);
                    if (destinationElement) destinationElement.textContent = destinationName;
                    
                    loadStoppingPattern(run_id, function(stops) {
                        var nextStationsDiv = document.querySelector('.route-info');
                        if (nextStationsDiv && nextStationsDiv.querySelector('.no-trains')) {
                            restoreNormalDisplay();
                        }
                        
                        if (stops) {
                            var expressInfo = populateStationDivs(stops, currentStopId, final_stop_id, route_id);
                            var routeInfo = analyzeInboundRoute(stops, currentStopId);
                            if (!routeInfo) {
                                routeInfo = analyzeOutboundRoute(stops, currentStopId, expressInfo);
                            }
                            
                            var currentRouteInfoElement = document.querySelector('.route-info span');
                            if (currentRouteInfoElement && routeInfo) {
                                currentRouteInfoElement.textContent = routeInfo;
                            }
                        }
                    });
                }
                
                if (departureTimeElement) {
                    var timeString = new Date(scheduled_departure_utc).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                    timeString = timeString.replace('AM', 'am').replace('PM', 'pm');
                    departureTimeElement.textContent = timeString;
                }
                
                if (delayIndicatorElement) {
                    if (delay_minutes >= 2) {
                        delayIndicatorElement.textContent = '+' + delay_minutes;
                    } else {
                        delayIndicatorElement.textContent = '';
                    }
                }
                
                if (durationElement) {
                    durationElement.textContent = calculateDuration(scheduled_departure_utc, estimated_departure_utc);
                }
                
                if (lastUpdatedElement) {
                    lastUpdatedElement.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
                }
            }, function(error) {
                if (error && error.status === 404) {
                    showNoDeparturesMessage(currentPlatform);
                    currentRunId = null;
                    return;
                }
                currentRunId = null;
                if (lastUpdatedElement) {
                    lastUpdatedElement.textContent = 'Error loading data';
                }
            });
        };

        settingsButton.addEventListener('click', toggleSettings);

        var cssDeparture = document.getElementById('cssDeparture');
        var themeLink = document.getElementById('departure-link');
        var cssHeader = document.getElementById('cssHeader');
        var theme2Link = document.getElementById('header-link');

        var savedTheme = 'light.css';
        try { savedTheme = localStorage.getItem('theme') || 'light.css'; } catch(e){}
        themeLink.href = savedTheme;
        cssDeparture.value = savedTheme;

        var savedTheme2 = 'ptvnetwork2019.css';
        try { savedTheme2 = localStorage.getItem('theme2') || 'ptvnetwork2019.css'; } catch(e){}
        theme2Link.href = savedTheme2;
        cssHeader.value = savedTheme2;

        cssDeparture.addEventListener('change', function(e) {
            var newTheme = e.target.value;
            themeLink.href = newTheme;
            try { localStorage.setItem('theme', newTheme); } catch(err){}
        });

        cssHeader.addEventListener('change', function(e) {
            var newTheme2 = e.target.value;
            theme2Link.href = newTheme2;
            try { localStorage.setItem('theme2', newTheme2); } catch(err){}
        });

        var updateFutureDepartures = function() {
            if (isUserChange) {
                setTimeout(function() { isUserChange = false; }, 500);
            }

            var baseUrl = 'https://melbptboard-opt.onrender.com/api/departures?stop_id=' + currentStopId + '&max_results=3';
            var url = currentPlatform ? baseUrl + '&platform=' + currentPlatform : baseUrl;
            
            apiGet(url, function(data) {
                if (data && data.departures) {
                    var futureDeps = data.departures.slice(1, 3);
                    if (futureDeps.length === 0) {
                        hideFutureDepartures();
                        return;
                    }
                    populateFutureDeparture(futureDeps[0], 0);
                    populateFutureDeparture(futureDeps[1], 1);
                }
            }, function(error) {
                hideFutureDepartures();
            });
        };

        var populateFutureDeparture = function(departure, index) {
            var futureItems = document.querySelectorAll('.departure-item.future');
            var item = futureItems[index];
            if (!item) return;
            
            if (!departure) {
                item.style.display = 'none';
                return;
            }
            
            item.style.display = 'block';
            var colors = routeColors[departure.route_id] || { background: '#95979A', text: '#000000' };
            var futureHeader = item.querySelector('.departure-header.future');
            if (futureHeader) {
                futureHeader.style.borderLeftColor = colors.background;
            }
            
            var timeElement = item.querySelector('.departure-time.future');
            if (timeElement && departure.scheduled_departure_utc) {
                var timeString = new Date(departure.scheduled_departure_utc).toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit', 
                    hour12: true 
                });
                timeString = timeString.replace('AM', 'am').replace('PM', 'pm');
                timeElement.textContent = timeString;
            }
            
            var destElement = item.querySelector('.destination.future');
            if (destElement) {
                var finalStopId = departure.final_stop_id || departure.direction_id;
                destElement.textContent = getStationName(finalStopId);
            }
            
            var delayElement = item.querySelector('.delay-indicator.future');
            if (delayElement) {
                if (departure.delay_minutes >= 2) {
                    delayElement.textContent = '+' + departure.delay_minutes;
                    delayElement.style.display = '';
                } else {
                    delayElement.textContent = '';
                    delayElement.style.display = 'none';
                }
            }
            
            var durationElement = item.querySelector('.duration.future');
            if (durationElement) {
                durationElement.textContent = calculateDuration(
                    departure.scheduled_departure_utc, 
                    departure.estimated_departure_utc
                );
            }
            
            var routeInfoElement = item.querySelector('.route-info.future');
            if (routeInfoElement) {
                routeInfoElement.textContent = 'Stopping all stations';
            }
        };

        var hideFutureDepartures = function() {
            var futureItems = document.querySelectorAll('.departure-item.future');
            for (var i = 0; i < futureItems.length; i++) {
                futureItems[i].style.display = 'none';
            }
        };

        var initApp = function() {
            loadRouteOrder();
            var stationExists = false;
            for (var i = 0; i < stationsData.length; i++) {
                if (stationsData[i].stop_id === currentStopId) {
                    stationExists = true;
                    break;
                }
            }
            if (!stationExists) {
                currentStopId = 1127;
                currentPlatform = "1";
            }
            populateStationDropdown();
            updatePlatformDropdown(currentPlatform);
            updateBoard();
            updateFutureDepartures();
            
            setInterval(function() {
                updateBoard();
                updateFutureDepartures();
            }, 20000);
        };

        loadStations();
    });

    function updateClock() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = String(now.getMinutes());
        if (minutes.length < 2) minutes = '0' + minutes;
        var seconds = String(now.getSeconds());
        if (seconds.length < 2) seconds = '0' + seconds;
        var period = (hours >= 12) ? 'pm' : 'am';
        hours = hours % 12; 
        hours = hours ? hours : 12; 
        var timeString = hours + ':' + minutes + ':' + seconds + ' ' + period;
        var clockElement = document.getElementById('live-clock');
        if (clockElement) {
            clockElement.textContent = timeString;
        }
    }
    window.onload = function() {
        updateClock();
        setInterval(updateClock, 1000);
    }
    </script>
</body>
</html>
