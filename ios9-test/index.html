<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="MelBoard">
    <link rel="apple-touch-icon" href="melboard-icon.png">
    <link rel="stylesheet" href="light.css" id="departure-link">
    <link rel="stylesheet" href="ptvnetwork2019.css" id="header-link">
    <title>Melb PT Departure Board</title>
    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #000000;
        font-family: 'Network Sans 2019', Arial, sans-serif;
        -webkit-text-size-adjust: 99%;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('NETWORKSANS-2019-REGULAR.TTF') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('NETWORKSANS-2019-MEDIUM.TTF') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('NETWORKSANS-2019-BOLD.TTF') format('truetype');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'Network Sans 2019';
        src: url('NETWORKSANS-2019-LIGHT.TTF') format('truetype');
        font-weight: 200;
        font-style: normal;
        font-display: swap;
    }

    .station-board {
        width: 1024px;
        overflow: hidden;
        margin: 0 auto;
        position: relative;
        left: 0;
    }

    .alert-icon {
        width: 32px;
        height: 32px;
        background-color: #FE5000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 900;
        font-size: 24px;
    }

    .clock {
        font-size: 36px;
        font-variant-numeric: tabular-nums;
        width: 280px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 3px 15px;
    }

    .delay-indicator {
        color: #FE5000;
        font-size: 52px;
        font-weight: bold;
        margin-right: 16px;
    }

    .delay-indicator.future {
        font-size: 24px;
        margin-right: 12px;
    }

    .departure-container {
        transition: margin-top 0.5s ease-out;
        margin-top: -2px;
        height: 720px;
    }

    .departure-header {
        padding: 25px 20px 0px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 25px solid;
        border-top-color: var(--route-bg-color, #95979A); /* Explicitly set border-top-color */
        height: 90px;
    }
        
    .departure-header .platform {
        background-color: var(--route-bg-color, #95979A);
        color: var(--route-text-color, #000000);
        padding: 8px;
        font-size: 28px;
        font-weight: 900;
        width: 40px;
        height: 50px;
        text-align: center;
    }

    .departure-header.future {
        padding: 5px;
        margin-top: 5px;
        margin-bottom: 5px;
        height: initial;
        border-top: none;
        border-left: 6px solid var(--route-bg-color, #95979A);
    }

    .departure-item {
        margin: 0 auto 0 auto;
        overflow: hidden;
    }

    .departure-item.future {
        margin: 4px 0 4px 15px;
        position: relative;
        left: 0px;
    }

    .departure-time {
        font-size: 56px;
        font-family: 'Network Sans 2019', Arial, sans-serif;
        font-weight: 200;
    }

    .departure-time.future {
        font-size: 26px;
    }

    .departurestack {
        width: 75%;
        margin-left: 5px;
    }

    .destination {
        font-size: 64px;
        font-family: 'Network Sans 2019', Arial, sans-serif;
        font-weight: 600;
    }

    .destination.future {
        font-size: 28px;
        font-weight: 600;
        padding-left: 10px;
    }

    .duration {
        padding: 4px;
        font-size: 56px;
        font-weight: normal;
        min-width: 240px;
        text-align: center;
        height: 80px;
        line-height: 1.2;
    }

    .duration.future {
        font-size: 28px;
        font-weight: 800;
        min-width: 130px;
        height: 42px;
        padding: 2px;
    }

    .header-and-platform-wrapper {
        display: flex;
        align-items: flex-start;
        min-height: 125px;
        transition: margin-top 0.3s ease-out;
        /* Pulls the header up off the screen by default */
        margin-top: -194px;
    }

    /* Slides both down into view when revealed or pinned */
    .station-board.revealed .header-and-platform-wrapper,
    .station-board.revealed .pin-button,
    .hidden-pin-toggle:checked ~ .pin-button ~ .header-and-platform-wrapper,
    .hidden-pin-toggle:checked ~ .pin-button {
        margin-top: 0 !important;
    }

    .hidden-pin-toggle {
        display: none;
    }

    .hidden-pin-toggle:checked ~ .pin-button ~ .header-and-platform-wrapper,
    .hidden-pin-toggle:checked ~ .pin-button {
        margin-top: 0 !important;
    }

    .hidden-pin-toggle:checked ~ #settings-panel,
    .station-board:is(:not(.touch-mode):hover, .revealed) .hidden-pin-toggle:not(:checked) ~ #settings-panel {
        margin-top: 0 !important;
    }

    #headerPlatform {
        text-align: center;
        color: #333434;
        background-color: #fff;
        flex-shrink: 0;
        border-left: 2px solid #707372;
    }

    .last-updated {
        font-size: 8px;
        padding: 2px;
    }

    .next-station {
        font-size: 26px;
        font-weight: normal;
        padding-left: 18px;
        position: relative;
        display: flex;
        align-items: center;
        border-left: 6px solid var(--route-bg-color, #95979A);
    }

    .next-station::before {
        content: '◼︎';
        font-weight: 900;
        font-size: 12px;
        position: absolute;
        left: -2px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--route-bg-color, #95979A);
    }

    .next-station.current {
        border-left: 6px solid var(--route-bg-color, #95979A);
    }

    .next-station.current .station-text {
        padding: 4px 6px;
        background-color: var(--route-bg-color, #95979A);
        color: var(--route-text-color, #95979A);
    }

    .next-station.last-station {
        border-left: none !important;
        padding-left: 25px;
    }

    .next-station.last-station::before {
        content: '';
        display: inline-block;
        position: absolute;
        left: -10px;
        top: 8px;
        width: 25px;
        height: 25px;
        background-color: var(--route-bg-color, #95979A);
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="20" y1="75" x2="80" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="50" y1="0" x2="50" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="20" y1="75" x2="80" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/><line x1="50" y1="0" x2="50" y2="75" stroke="black" stroke-width="22" stroke-linecap="butt"/></svg>');
    }

    .next-station.skipped::before {
        content: '';
        position: absolute;
        left: -10px;
        top: 97%;
        transform: translate(0, -50%);
        width: 30px;
        height: 30px;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:white;stroke-width:15px;"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:white;stroke-width:15px;"/></svg>');
    }

    .next-station.skipped::after {
        content: '';
        position: absolute;
        left: -14px;
        top: 85%;
        transform: translate(0, -50%);
        width: 45px;
        height: 45px;
        background-color: var(--route-bg-color, #95979A);
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:black;stroke-width:12px;"/></svg>');
        -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M4.172,11.07L23.998,33.89L43.828,11.07" style="fill:none;stroke:black;stroke-width:12px;"/></svg>');
    }

    /* iOS 9 Safari Fix: Hide indicators for any skipped station that follows another skipped station */
    .next-station.skipped ~ .next-station.skipped:before,
    .next-station.skipped ~ .next-station.skipped:after {
        display: none !important;
        content: "" !important;
    }

    .next-station.continuing {
        min-height: 2lh;
    }

    .next-station.continuing .station-text {
        color: #000;
        font-size: 30px;
        font-weight: 200;
        font-style: italic;
        padding-left: 10px;
    }

    .next-stations {
        padding: 0px 20px 5px 0px;
        margin-left: 20px;
        margin-right: 20px;
        min-height: 380px;
    }

    .no-trains {
        font-size: 42px;
        font-weight: 600;
        text-align: center;
        top: 50px;
    }

    .otherdepartures {
        display: flex;
    }

    .pin-button {
        position: absolute;
        top: 150px;
        left: -5px;
        cursor: pointer;
        z-index: 1002;
        padding: 5px;
        border-radius: 50%;
        transition: margin-top 0.3s ease-out;
        /* Pulls the pin button up with the header */
        margin-top: -155px;
    }

    .pin-button svg {
        width: 24px;
        height: 24px;
        fill: #707372;
        transition: transform 0.3s ease-out;
    }

    .hidden-pin-toggle:checked + .pin-button svg {
        transform: rotate(45deg);
    }

    .route-bgcolor {
        background-color: #95979A;
        color: #000000;
    }

    .route-color {
        color: #95979A;
    }

    .route-info {
        padding: 30px 20px 8px 25px;
        font-size: 34px;
        font-weight: 200;
        justify-content: space-between;
        align-items: center;
        height: 90px;
    }

    .route-info.future {
        padding: 0px;
        padding-left: 20px;
        font-size: 21px;
        justify-content: normal;
        align-items: normal;
        height: initial;
    }

    .settings {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        position: relative;
        margin-top: 0px;
        left: 60px;
        width: 100%;
        z-index: 1000;
    }

    .settings select {
        padding: 2px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-size: 16px;
    }

    #settingsButton {
        background: none;
        border: none;
        cursor: pointer;
        outline: none;
        display: inline-flex;
        align-items: center;
        position: absolute;
        left: 27px;
        top: 150px;
        z-index: 1003;
    }

    #settingsButton svg {
        margin: 5px;
        width: 20px;
        height: 20px;
        display: block;
    }

    .station-header {
        width: 100%;
        box-shadow: inset 0 8px 8px -10px rgba(0, 0, 0, 0.8);
        transition: margin-top 0.5s ease-out;
        position: relative;
        z-index: 1001;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        flex-grow: 1;
    }

    .station-name {
        font-size: 56px;
        padding-top: 16px;
        width: 100%;
        height: 100px;
    }

    .stations-column {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding-top: 12px;
        background-repeat: no-repeat;
        position: relative;
    }

    .stations-list {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: flex-start;
    }

    .time-destination {
        display: flex;
        align-items: center;
    }

    .time-destination span {
        margin-right: 15px; /* Safely spaces them out on all versions of Safari */
    }

    .time-destination.future span {
        margin-right: 2px; /* Safely spaces future destination items */
    }

    .time-info {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .time-info.future {
        margin-top: 0px;
    }

    .departure-time, .destination, 
    .departure-time.future, .destination.future, .duration.future {
        line-height: 1.3;
    }
        
    .time-destination, .time-info, .time-destination.future, .time-info.future {
        align-items: baseline;
    }
    
    </style>
</head>
<body>
    <div class="station-board">
        <input type="checkbox" id="pin-toggle" class="hidden-pin-toggle">
        <label for="pin-toggle" class="pin-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 12V4H17V2H7V4H8V12L6 14V16H11.2V22H12.8V16H18V14L16 12Z" />
            </svg>
        </label>
        <div class="header-and-platform-wrapper">
            <div class="station-header">
                <div class="station-name"></div>
                <button id="settingsButton" aria-expanded="false" aria-controls="settings-panel" title="Toggle Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                        <path id="gearOutline" d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" fill="#333434" />
                        <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" fill="#000000"/>
                    </svg>
                </button>
            </div>
            <div class="platform" id="headerPlatform"></div>
        </div>
        <div class="settings" id="settings-panel">
            <select id="stationSelect">
                <option value="">Select Station...</option>
            </select>
            <select id="platformSelect" style="width:40px;">
                <option value="">All Platforms</option>
            </select>
            <select id="cssDeparture">
                <option value="light.css">light</option>
                <option value="dark.css">dark</option>
            </select>
            <select id="cssHeader">
                <option value="ptvnetwork2019.css">PTV 2024</option>
                <option value="ptvhelvetica.css">PTV 2012</option>
                <option value="metlink2003.css">Metlink 2003</option>
                <option value="ptcgoudy.css">PTC Goudy</option>
            </select>
        </div>
        <div class="departure-container">
            <div class="departure-item" style="display: block;">
               <div class="departure-header">
                   <div class="time-destination">
                     <span class="departure-time"></span>
                     <span class="destination"></span>
                    </div>
                    <div class="time-info">
                     <div class="delay-indicator"></div>
                     <div class="duration"></div>
                    </div>
                </div>
                <div class="route-info"><span></span></div>
                <div class="next-stations">
                 <div class="stations-list"></div>
                </div>
            </div>
            <div class="otherdepartures">
                <div class="departurestack">
                    <div class="departure-item future">
                        <div class="departure-header future">
                            <div class="time-destination future">
                                <span class="departure-time future"></span>
                                <span class="destination future"></span>
                                <span class="route-info future"></span>
                            </div>
                            <div class="time-info future">
                                <div class="delay-indicator future"></div>
                                <div class="duration future"></div>
                            </div>
                        </div>
                    </div>
                    <div class="departure-item future">
                        <div class="departure-header future">
                            <div class="time-destination future">
                                <span class="departure-time future"></span>
                                <span class="destination future"></span>
                                <span class="route-info future"></span>
                            </div>
                            <div class="time-info future">
                                <div class="delay-indicator future"></div>
                                <div class="duration future"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="clock"><span id="live-clock"></span></div>
            </div>
        </div>
        <div class="last-updated" id="lastUpdated">Loading...</div>
    </div>

    <script type="text/javascript">
    // STRICT ES5 JAVASCRIPT FOR iOS 9 SAFARI COMPATIBILITY (INCLUDING FULL STATION GRIDS & FUTURE DEPARTURES)
    document.addEventListener('DOMContentLoaded', function() {
        var departureItem = document.querySelector('.departure-item');
        var destinationElement = document.querySelector('.destination');
        var platformElement = document.querySelector('.departure-header .platform');
        var headerPlatformElement = document.getElementById('headerPlatform');
        var stationNameElement = document.querySelector('.station-name');
        var lastUpdatedElement = document.getElementById('lastUpdated');
        var routeInfoElement = document.querySelector('.route-info span');
        var departureTimeElement = document.querySelector('.departure-time');
        var delayIndicatorElement = document.querySelector('.delay-indicator');
        var durationElement = document.querySelector('.duration');
        var headerElement = document.querySelector('.station-header');
        var stationBoardElement = document.querySelector('.station-board');
        var settingsButton = document.getElementById('settingsButton');
        var settingsPanel = document.getElementById('settings-panel');
        
        var currentStopId = 1127;
        var currentPlatform = "1";
        var currentRunId = null;
        var isUserChange = false;

        // Parse query parameters manually for old WebKit
        if (window.location.search) {
            var search = window.location.search.substring(1);
            var pairs = search.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                if (pair[0] === 'stop') currentStopId = parseInt(pair[1], 10) || 1127;
                if (pair[0] === 'platform') currentPlatform = pair[1];
            }
        }

        var getDepartureApiUrl = function() {
            var baseUrl = '/api/next-departure?stop_id=' + currentStopId;
            return currentPlatform ? baseUrl + '&platform=' + currentPlatform : baseUrl;
        };
        
        var stationsData = null;
        var routeOrderData = null;

        var routeColors = {
            3: { background: '#FFBE00', text: '#000000' },
            14: { background: '#279FD5', text: '#000000' },
            15: { background: '#FFBE00', text: '#000000' },
            6: { background: '#028430', text: '#FFFFFF' },
            16: { background: '#F178AF', text: '#000000' },
            17: { background: '#F178AF', text: '#000000' },
            12: { background: '#F178AF', text: '#000000' },
            4: { background: '#279FD5', text: '#000000' },
            11: { background: '#279FD5', text: '#000000' },
            2: { background: '#152C6B', text: '#FFFFFF' },
            9: { background: '#152C6B', text: '#FFFFFF' },
            1: { background: '#152C6B', text: '#FFFFFF' },
            7: { background: '#152C6B', text: '#FFFFFF' },
            5: { background: '#BE1014', text: '#FFFFFF' },
            8: { background: '#BE1014', text: '#FFFFFF' },
            88: { background: '#95979A', text: '#000000' },
            13: { background: '#95979A', text: '#000000' }
        };

        var ajaxGet = function(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback(e, null);
                        }
                    } else {
                        callback(new Error('HTTP Error ' + xhr.status), null);
                    }
                }
            };
            xhr.send();
        };

        var loadStations = function(callback) {
            ajaxGet('stations.json', function(err, data) {
                if (!err && data && data.stations) {
                    stationsData = data.stations;
                }
                callback();
            });
        };

        var loadRouteOrder = function(callback) {
            ajaxGet('route-order.json', function(err, data) {
                if (!err && data && data.routes) {
                    routeOrderData = data.routes;
                }
                callback();
            });
        };

        var getStationName = function(stopId) {
            if (!stationsData) return 'Stop ' + stopId;
            for (var i = 0; i < stationsData.length; i++) {
                if (stationsData[i].stop_id === stopId) {
                    return stationsData[i].stop_name;
                }
            }
            return 'Stop ' + stopId;
        };

        var isInterchangeStation = function(stopId) {
            if (!stationsData) return false;
            for (var i = 0; i < stationsData.length; i++) {
                if (stationsData[i].stop_id === stopId) {
                    return stationsData[i].interchange === true;
                }
            }
            return false;
        };

        var calculateDuration = function(scheduledTime, estimatedTime) {
            var departureTime = new Date(estimatedTime || scheduledTime);
            var now = new Date();
            var diffMinutes = Math.floor((departureTime.getTime() - now.getTime()) / 60000);
            
            if (diffMinutes < 1) return "NOW";
            if (diffMinutes < 60) return diffMinutes + " min";
            var hours = Math.floor(diffMinutes / 60);
            var mins = diffMinutes % 60;
            return hours + "h " + mins + "m";
        };

        var updateAddress = function() {
            var params = 'stop=' + currentStopId;
            if (currentPlatform) params += '&platform=' + currentPlatform;
            history.replaceState(null, '', '?' + params);
        };

        var populateStationDropdown = function() {
            var select = document.getElementById('stationSelect');
            if (stationsData && select) {
                select.innerHTML = '<option value="">Select Station...</option>';
                for (var i = 0; i < stationsData.length; i++) {
                    var option = document.createElement('option');
                    option.value = stationsData[i].stop_id;
                    option.textContent = stationsData[i].stop_name;
                    select.appendChild(option);
                }
                select.value = currentStopId;
                select.onchange = function(e) {
                    currentStopId = parseInt(e.target.value, 10);
                    if (currentStopId) {
                        isUserChange = true;
                        hideFutureDepartures();
                        updatePlatformDropdown();
                        updateAddress();
                        updateBoard();
                        updateFutureDepartures();
                    }
                };
            }
        };

        var updatePlatformDropdown = function() {
            var select = document.getElementById('platformSelect');
            if (!select) return;
            var platformCount = 2;
            if (stationsData) {
                for (var i = 0; i < stationsData.length; i++) {
                    if (stationsData[i].stop_id === currentStopId) {
                        platformCount = stationsData[i].number_of_platforms || 2;
                        break;
                    }
                }
            }
            
            select.innerHTML = '<option value="">All Platforms</option>';
            for (var p = 1; p <= platformCount; p++) {
                var option = document.createElement('option');
                option.value = p;
                option.textContent = p + '';
                select.appendChild(option);
            }
            select.value = currentPlatform || "1";
            select.onchange = function(e) {
                currentPlatform = e.target.value;
                updateAddress();
                isUserChange = true;
                hideFutureDepartures();
                updateBoard();
                updateFutureDepartures();
            };
        };

        var loadStoppingPattern = function(runId, callback) {
            ajaxGet('/api/run/stops?run_id=' + runId, function(err, data) {
                if (err || !data) {
                    callback(null);
                    return;
                }
                callback(data.stops || []);
            });
        };

        var getRouteSegment = function(routeId, stopId, finalStopId) {
            if (!routeOrderData) return null;
            var routeStops = null;
            var currentPos = -1;
            var finalPos = -1;

            var keys = Object.keys(routeOrderData);
            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                var route = routeOrderData[key];
                var usable = key === String(routeId) || (route.route_ids && route.route_ids.indexOf(Number(routeId)) !== -1);
                if (!usable) continue;

                var c = -1, f = -1;
                for (var j = 0; j < route.stops.length; j++) {
                    if (route.stops[j].stop_id === stopId) c = j;
                    if (route.stops[j].stop_id === finalStopId) f = j;
                }

                if (c !== -1 && f !== -1) {
                    routeStops = route.stops;
                    currentPos = c;
                    finalPos = f;
                    break;
                }
            }

            if (!routeStops) return null;

            var segment;
            if (currentPos < finalPos) {
                segment = routeStops.slice(currentPos, finalPos + 1);
            } else {
                segment = routeStops.slice(finalPos, currentPos + 1).reverse();
            }
            return segment;
        };

        var detectExpressService = function(routeSegment, actualStops) {
            if (!routeSegment || routeSegment.length === 0) return { isExpress: false, skipped: [] };
            
            var actualStopIds = [];
            for (var i = 0; i < actualStops.length; i++) {
                actualStopIds.push(actualStops[i].stop_id);
            }

            var skippedStations = [];
            var consecutiveSkips = 0;
            var maxConsecutiveSkips = 0;

            for (var j = 0; j < routeSegment.length; j++) {
                var stopId = routeSegment[j].stop_id;
                if (actualStopIds.indexOf(stopId) === -1) {
                    skippedStations.push(routeSegment[j]);
                    consecutiveSkips++;
                    if (consecutiveSkips > maxConsecutiveSkips) {
                        maxConsecutiveSkips = consecutiveSkips;
                    }
                } else {
                    consecutiveSkips = 0;
                }
            }

            return {
                isExpress: maxConsecutiveSkips >= 2,
                skipped: skippedStations,
                singleSkip: skippedStations.length === 1 ? skippedStations[0] : null
            };
        };

        var calculateColumnDistribution = function(numStops) {
            if (numStops <= 7) return { columns: 1, distribution: [numStops] };
            if (numStops <= 14) {
                var col1 = Math.ceil(numStops / 2);
                return { columns: 2, distribution: [col1, numStops - col1] };
            }
            if (numStops <= 24) {
                var base = Math.floor(numStops / 3);
                var rem = numStops % 3;
                var dist = [base, base, base];
                for (var i = 0; i < rem; i++) dist[i]++;
                return { columns: 3, distribution: dist };
            }
            if (numStops <= 30) return { columns: 3, distribution: [10, 10, numStops - 20] };
            return { columns: 4, distribution: [10, 10, 10, numStops - 30] };
        };

        var analyzeInboundRoute = function(stops, stopId) {
            var cityStations = [1155, 1071, 1181, 1068, 1120];
            var loopStations = [1068, 1120, 1155];
            
            var currentIndex = -1;
            for (var i = 0; i < stops.length; i++) {
                if (stops[i].stop_id === stopId) { currentIndex = i; break; }
            }
            if (currentIndex === -1) return null;

            var futureCityStations = [];
            for (var j = currentIndex + 1; j < stops.length; j++) {
                futureCityStations.push(stops[j].stop_id);
            }

            var hasFutureCity = false;
            var firstCity = null;
            for (var k = 0; k < futureCityStations.length; k++) {
                if (cityStations.indexOf(futureCityStations[k]) !== -1) {
                    hasFutureCity = true;
                    firstCity = futureCityStations[k];
                    break;
                }
            }
            if (!hasFutureCity) return null;

            if (firstCity === 1071) return "Direct to Flinders Street";
            
            var hasLoop = false;
            for (var l = 0; l < futureCityStations.length; l++) {
                if (loopStations.indexOf(futureCityStations[l]) !== -1) { hasLoop = true; break; }
            }
            if (hasLoop) return "via the City Loop";
            if (firstCity === 1181) return "via Southern Cross";
            return "to City";
        };

        var analyzeOutboundRoute = function(stops, stopId, expressInfo) {
            var loopStations = [1068, 1120, 1155];
            var tunnelStations = [1232, 1233, 1234, 1235, 1236];
            
            var currentIndex = -1;
            for (var i = 0; i < stops.length; i++) {
                if (stops[i].stop_id === stopId) { currentIndex = i; break; }
            }
            if (currentIndex === -1) return null;

            var futureIds = [];
            for (var j = currentIndex; j < stops.length; j++) {
                futureIds.push(stops[j].stop_id);
            }

            var hasLoop = false;
            for (var l = 0; l < futureIds.length; l++) {
                if (loopStations.indexOf(futureIds[l]) !== -1) { hasLoop = true; break; }
            }

            var hasTunnel = false;
            for (var t = 1; t < futureIds.length; t++) {
                if (tunnelStations.indexOf(futureIds[t]) !== -1) { hasTunnel = true; break; }
            }

            var baseText = "Stopping all stations";
            if (expressInfo && expressInfo.isExpress) {
                baseText = "Express";
            } else if (expressInfo && expressInfo.singleSkip) {
                baseText = "Stopping all stations except " + getStationName(expressInfo.singleSkip.stop_id);
            }

            if (hasLoop) return baseText + " via City Loop";
            if (hasTunnel) return baseText + " via Metro Tunnel";
            return baseText;
        };

        var showNoDeparturesMessage = function() {
            var stationsList = document.querySelector('.stations-list');
            if (stationsList) stationsList.innerHTML = '';
            if (departureTimeElement) departureTimeElement.style.display = 'none';
            if (delayIndicatorElement) delayIndicatorElement.style.display = 'none';
            if (durationElement) durationElement.style.display = 'none';
            if (platformElement) platformElement.style.display = 'none';
            if (routeInfoElement) routeInfoElement.textContent = '';
            
            var nextStationsDiv = document.querySelector('.route-info');
            if (nextStationsDiv) {
                nextStationsDiv.innerHTML = '<div class="no-trains">No trains are departing from<br>this platform</div>';
            }
            if (destinationElement) destinationElement.textContent = '';
            if (stationNameElement) stationNameElement.textContent = getStationName(currentStopId);
            if (headerPlatformElement) headerPlatformElement.textContent = currentPlatform || '?';
        };

        var restoreNormalDisplay = function() {
            var routeInfoContainer = document.querySelector('.departure-item .route-info');
            if (routeInfoContainer) routeInfoContainer.innerHTML = '<span></span>';
            if (departureTimeElement) departureTimeElement.style.display = '';
            if (delayIndicatorElement) delayIndicatorElement.style.display = '';
            if (durationElement) durationElement.style.display = '';
            if (platformElement) platformElement.style.display = '';
        };

        var populateStationDivs = function(stops, stopId, finalStopId, routeId) {
            var stationsList = document.querySelector('.stations-list');
            if (!stationsList) return null;
            stationsList.innerHTML = '';

            if (!stops || stops.length === 0) return null;

            var routeSegment = getRouteSegment(routeId, stopId, finalStopId);
            var cityStops = [];
            var suburbanStartIndex = 0;

            if (!routeSegment) {
                var currentIndex = -1;
                for (var i = 0; i < stops.length; i++) {
                    if (stops[i].stop_id === stopId) { currentIndex = i; break; }
                }

                for (var j = currentIndex; j < stops.length; j++) {
                    var testSegment = getRouteSegment(routeId, stops[j].stop_id, finalStopId);
                    if (testSegment) {
                        routeSegment = testSegment;
                        suburbanStartIndex = j;
                        cityStops = stops.slice(currentIndex, j);
                        break;
                    }
                }

                if (!routeSegment) {
                    populateActualStopsOnly(currentIndex >= 0 ? stops.slice(currentIndex) : stops, finalStopId);
                    return null;
                }
            }

            var suburbanStops = stops.slice(suburbanStartIndex);
            var expressInfo = detectExpressService(routeSegment, suburbanStops);
            
            var actualStopIds = [];
            for (var s = 0; s < suburbanStops.length; s++) {
                actualStopIds.push(suburbanStops[s].stop_id);
            }

            var totalStops = cityStops.length + routeSegment.length;
            var maxSlots = 40;
            var needsMessage = totalStops > maxSlots;
            var distObj = calculateColumnDistribution(needsMessage ? maxSlots : totalStops);
            var numColumns = distObj.columns;
            var distribution = distObj.distribution;

            for (var c = 0; c < numColumns; c++) {
                var column = document.createElement('div');
                column.className = 'stations-column route-color';
                stationsList.appendChild(column);
            }

            var columns = stationsList.querySelectorAll('.stations-column');
            var stationIndex = 0;
            var slot = 0;

            for (var colIdx = 0; colIdx < numColumns; colIdx++) {
                var countInCol = distribution[colIdx];
                for (var itemIdx = 0; itemIdx < countInCol && stationIndex < totalStops; itemIdx++) {
                    if (needsMessage && slot >= 36 && slot < 37) {
                        var msgDiv = document.createElement('div');
                        msgDiv.className = 'next-station continuing route-color';
                        var msgText = document.createElement('span');
                        msgText.className = 'station-text';
                        msgText.textContent = ' Continues to';
                        msgDiv.appendChild(msgText);
                        columns[colIdx].appendChild(msgDiv);
                        slot++;
                        continue;
                    }
                    if (needsMessage && slot === 37) {
                        stationIndex = totalStops - 1;
                    }

                    var stationDiv = document.createElement('div');
                    var stationText = document.createElement('span');
                    stationText.className = 'station-text';

                    if (stationIndex < cityStops.length) {
                        var cityStop = cityStops[stationIndex];
                        stationDiv.className = 'next-station route-color';
                        if (stationIndex === 0) stationDiv.classList.add('current');
                        if (isInterchangeStation(cityStop.stop_id)) stationDiv.classList.add('interchange');
                        stationText.textContent = getStationName(cityStop.stop_id);
                    } else {
                        var routeStop = routeSegment[stationIndex - cityStops.length];
                        var isActual = actualStopIds.indexOf(routeStop.stop_id) !== -1;
                        stationDiv.className = isActual ? 'next-station route-color' : 'next-station skipped route-color';
                        if (stationIndex === 0) stationDiv.classList.add('current');
                        if (routeStop.stop_id === finalStopId) stationDiv.classList.add('last-station');
                        if (isInterchangeStation(routeStop.stop_id)) stationDiv.classList.add('interchange');
                        stationText.textContent = getStationName(routeStop.stop_id);
                    }

                    stationDiv.appendChild(stationText);
                    columns[colIdx].appendChild(stationDiv);
                    stationIndex++;
                    slot++;
                }
            }
            return expressInfo;
        };

        var populateActualStopsOnly = function(stopsToShow, finalStopId) {
            var stationsList = document.querySelector('.stations-list');
            if (!stationsList) return;
            var maxSlots = 40;
            var needsMessage = stopsToShow.length > maxSlots;
            var distObj = calculateColumnDistribution(needsMessage ? maxSlots : stopsToShow.length);
            var numColumns = distObj.columns;
            var distribution = distObj.distribution;

            for (var c = 0; c < numColumns; c++) {
                var column = document.createElement('div');
                column.className = 'stations-column route-color';
                stationsList.appendChild(column);
            }

            var columns = stationsList.querySelectorAll('.stations-column');
            var stationIndex = 0;
            var slot = 0;

            for (var colIdx = 0; colIdx < numColumns; colIdx++) {
                var countInCol = distribution[colIdx];
                for (var itemIdx = 0; itemIdx < countInCol && stationIndex < stopsToShow.length; itemIdx++) {
                    var stop = stopsToShow[stationIndex];
                    var stationDiv = document.createElement('div');
                    stationDiv.className = 'next-station route-color';
                    if (stationIndex === 0) stationDiv.classList.add('current');
                    if (stop.stop_id === finalStopId) stationDiv.classList.add('last-station');
                    if (isInterchangeStation(stop.stop_id)) stationDiv.classList.add('interchange');

                    var stationText = document.createElement('span');
                    stationText.className = 'station-text';
                    stationText.textContent = getStationName(stop.stop_id);

                    stationDiv.appendChild(stationText);
                    columns[colIdx].appendChild(stationDiv);
                    stationIndex++;
                    slot++;
                }
            }
        };

        var updateBoard = function() {
            ajaxGet(getDepartureApiUrl(), function(err, data) {
                if (err || !data || data.platform_number === null) {
                    showNoDeparturesMessage();
                    currentRunId = null;
                    return;
                }

                if (currentPlatform && String(data.platform_number) !== String(currentPlatform)) {
                    showNoDeparturesMessage();
                    currentRunId = null;
                    return;
                }

                var route_id = data.route_id;
                var platform_number = data.platform_number;
                var scheduled_departure_utc = data.scheduled_departure_utc;
                var estimated_departure_utc = data.estimated_departure_utc;
                var delay_minutes = data.delay_minutes || 0;
                var final_stop_id = data.final_stop_id;
                var run_id = data.run_id;

                var colors = routeColors[route_id] || { background: '#95979A', text: '#000000' };
                departureItem.style.setProperty('--route-bg-color', colors.background);
                departureItem.style.setProperty('--route-text-color', colors.text);
                
                // Direct color application for iOS 9 Safari border/background support
                var depHeader = document.querySelector('.departure-header');
                if (depHeader) depHeader.style.borderTopColor = colors.background;
                
                var platformElem = document.querySelector('.departure-header .platform');
                if (platformElem) {
                    platformElem.style.backgroundColor = colors.background;
                    platformElem.style.color = colors.text;
                }

                // Also apply route color to future headers
                var futureHeaders = document.querySelectorAll('.departure-header.future');
                for (var f = 0; f < futureHeaders.length; f++) {
                    futureHeaders[f].style.borderLeftColor = colors.background;
                }

                if (platformElement) platformElement.textContent = platform_number || '?';
                if (headerPlatformElement) headerPlatformElement.textContent = platform_number || '?';
                if (stationNameElement) stationNameElement.textContent = getStationName(currentStopId);
                if (destinationElement) destinationElement.textContent = getStationName(final_stop_id);

                if (departureTimeElement && scheduled_departure_utc) {
                    var date = new Date(scheduled_departure_utc);
                    var hours = date.getHours();
                    var minutes = date.getMinutes();
                    var ampm = hours >= 12 ? 'pm' : 'am';
                    hours = hours % 12;
                    hours = hours ? hours : 12;
                    var minStr = minutes < 10 ? '0' + minutes : minutes;
                    departureTimeElement.textContent = hours + ':' + minStr + ampm;
                }

                if (delayIndicatorElement) {
                    delayIndicatorElement.textContent = delay_minutes >= 2 ? '+' + delay_minutes : '';
                }

                if (durationElement) {
                    durationElement.textContent = calculateDuration(scheduled_departure_utc, estimated_departure_utc);
                }

                if (lastUpdatedElement) {
                    var now = new Date();
                    lastUpdatedElement.textContent = 'Last updated: ' + now.toLocaleTimeString();
                }

                if (run_id !== currentRunId) {
                    currentRunId = run_id;
                    loadStoppingPattern(run_id, function(stops) {
                        var nextStationsDiv = document.querySelector('.route-info');
                        if (nextStationsDiv && nextStationsDiv.querySelector('.no-trains')) {
                            restoreNormalDisplay();
                        }
                        if (stops) {
                            var expressInfo = populateStationDivs(stops, currentStopId, final_stop_id, route_id);
                            var routeInfo = analyzeInboundRoute(stops, currentStopId);
                            if (!routeInfo) {
                                routeInfo = analyzeOutboundRoute(stops, currentStopId, expressInfo);
                            }
                            var currentRouteInfoElem = document.querySelector('.route-info span');
                            if (currentRouteInfoElem && routeInfo) {
                                currentRouteInfoElem.textContent = routeInfo;
                            }
                        }
                    });
                }
            });
        };

        var hideFutureDepartures = function() {
            var futureItems = document.querySelectorAll('.departure-item.future');
            for (var i = 0; i < futureItems.length; i++) {
                futureItems[i].style.display = 'none';
            }
        };

        var populateFutureDeparture = function(departure, index) {
            var futureItems = document.querySelectorAll('.departure-item.future');
            var item = futureItems[index];
            if (!item) return;

            if (!departure) {
                item.style.display = 'none';
                return;
            }
            item.style.display = 'block';

            var colors = routeColors[departure.route_id] || { background: '#95979A', text: '#000000' };
            item.style.setProperty('--route-bg-color', colors.background);
            item.style.setProperty('--route-text-color', colors.text);

            var timeElem = item.querySelector('.departure-time.future');
            if (timeElem && departure.scheduled_departure_utc) {
                var date = new Date(departure.scheduled_departure_utc);
                var hours = date.getHours();
                var minutes = date.getMinutes();
                var ampm = hours >= 12 ? 'pm' : 'am';
                hours = hours % 12;
                hours = hours ? hours : 12;
                var minStr = minutes < 10 ? '0' + minutes : minutes;
                timeElem.textContent = hours + ':' + minStr + ampm;
            }

            var destElem = item.querySelector('.destination.future');
            if (destElem) {
                var finalStopId = departure.final_stop_id || departure.direction_id;
                destElem.textContent = getStationName(finalStopId);
            }

            var delayElem = item.querySelector('.delay-indicator.future');
            if (delayElem) {
                if (departure.delay_minutes >= 2) {
                    delayElem.textContent = '+' + departure.delay_minutes;
                    delayElem.style.display = '';
                } else {
                    delayElem.textContent = '';
                    delayElem.style.display = 'none';
                }
            }

            var durElem = item.querySelector('.duration.future');
            if (durElem) {
                durElem.textContent = calculateDuration(departure.scheduled_departure_utc, departure.estimated_departure_utc);
            }

            var routeInfoElem = item.querySelector('.route-info.future');
            if (routeInfoElem) {
                routeInfoElem.textContent = 'Stopping all stations';
            }
        };

        var updateFutureDepartures = function() {
            var baseUrl = '/api/departures?stop_id=' + currentStopId + '&max_results=3';
            var url = currentPlatform ? baseUrl + '&platform=' + currentPlatform : baseUrl;

            ajaxGet(url, function(err, data) {
                if (err || !data || !data.departures) {
                    hideFutureDepartures();
                    return;
                }
                var futureDeps = data.departures.slice(1, 3);
                if (futureDeps.length === 0) {
                    hideFutureDepartures();
                    return;
                }
                populateFutureDeparture(futureDeps[0], 0);
                populateFutureDeparture(futureDeps[1], 1);
            });
        };

        // Initialize Data Load & Settings Panel
        loadStations(function() {
            loadRouteOrder(function() {
                if (!stationsData) return;
                var found = false;
                for (var i = 0; i < stationsData.length; i++) {
                    if (stationsData[i].stop_id === currentStopId) { found = true; break; }
                }
                if (!found) {
                    currentStopId = 1127;
                    currentPlatform = "1";
                }
                populateStationDropdown();
                updatePlatformDropdown();
                
                // Setup Settings Toggle & CSS Switchers for iOS 9
                var settingsBtn = document.getElementById('settingsButton');
                var settingsPanel = document.getElementById('settings-panel');
                var boardElem = document.querySelector('.station-board');
                
                if (settingsBtn && settingsPanel) {
                    settingsBtn.onclick = function() {
                        var isVis = settingsPanel.style.opacity === '1';
                        settingsPanel.style.opacity = isVis ? '0' : '1';
                        settingsPanel.style.visibility = isVis ? 'hidden' : 'visible';
                        boardElem.classList.toggle('revealed', !isVis);
                    };
                }

                var cssDeparture = document.getElementById('cssDeparture');
                var themeLink = document.getElementById('departure-link');
                var savedTheme = localStorage.getItem('theme') || 'light.css';
                if (themeLink && cssDeparture) {
                    themeLink.href = savedTheme;
                    cssDeparture.value = savedTheme;
                    cssDeparture.onchange = function(e) {
                        var newTheme = e.target.value;
                        themeLink.href = newTheme;
                        localStorage.setItem('theme', newTheme);
                    };
                }

                var cssHeader = document.getElementById('cssHeader');
                var theme2Link = document.getElementById('header-link');
                var savedTheme2 = localStorage.getItem('theme2') || 'ptvnetwork2019.css';
                if (theme2Link && cssHeader) {
                    theme2Link.href = savedTheme2;
                    cssHeader.value = savedTheme2;
                    cssHeader.onchange = function(e) {
                        var newTheme2 = e.target.value;
                        theme2Link.href = newTheme2;
                        localStorage.setItem('theme2', newTheme2);
                    };
                }

                updateBoard();
                updateFutureDepartures();

                setInterval(function() {
                    updateBoard();
                    updateFutureDepartures();
                }, 20000);
            });
        });
    });

    function updateClock() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes();
        var seconds = now.getSeconds();
        var ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12;
        hours = hours ? hours : 12;
        var minStr = minutes < 10 ? '0' + minutes : minutes;
        var secStr = seconds < 10 ? '0' + seconds : seconds;
        var clockElement = document.getElementById('live-clock');
        if (clockElement) {
            clockElement.textContent = hours + ':' + minStr + ':' + secStr + ' ' + ampm;
        }
    }

    window.onload = function() {
        updateClock();
        setInterval(updateClock, 1000);
    };
    </script>
